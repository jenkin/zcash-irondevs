name: IamHarrie-Labs pipeline tests

on:
  push:
    branches: [feat/coauthorship-network-iamharrie]
    paths:
      - "projects/IamHarrie-Labs/**"
  pull_request:
    paths:
      - "projects/IamHarrie-Labs/**"

defaults:
  run:
    working-directory: projects/IamHarrie-Labs

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: projects/IamHarrie-Labs/.python-version

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pipeline tests
        run: uv run pytest pipeline/tests -v
