[project]
name = "zcash-irondevs"
version = "0.1.0"
description = "Ten years of Zcash: a dynamic co-authorship network with temporal community analysis"
requires-python = ">=3.12"
dependencies = [
    "pydriller>=2.6",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "click>=8.1",
    "orjson>=3.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Higher-order temporal path analysis (De Bruijn graph models over the
# co-authorship stream). Heavy (torch + torch-geometric) and only
# available from GitHub, so it's kept optional: the core pipeline runs
# and satisfies every required feature without it.
temporal-advanced = [
    "torch>=2.3",
    "torch-geometric>=2.5",
    "pathpyg",
]
dev = ["pytest>=8.0"]

[project.scripts]
irondevs = "pipeline.cli:main"

[tool.uv.sources]
pathpyg = { git = "https://github.com/pathpy/pathpyG.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
