[package]
name = "zcash_extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = "0.18"          # Wrapper for libgit2
rayon = "1.8"          # Data parallelism
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"            # Fast CSV serialization
chrono = { version = "0.4", features = ["serde"] } # Date and time manipulation
walkdir = "2.4"        # Recursive directory traversal
indicatif = "0.17"     # Console progress bar
anyhow = "1.0"         # Flexible error handling
regex = "1.10"         # Pattern matching in commit messages

# Dependencies for the embedded web server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }